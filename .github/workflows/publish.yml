name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # hatch-vcs needs full history
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: publish  # isolate from the CI workflow's caches
      - run: uv python install 3.12
      # xschem drives the CLI tests (run headless via `-x`); without it
      # tests/test_cli.py skips and cli.py coverage falls below the gate.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xschem
      - run: uv sync --extra dev --locked
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run pyright src/
      - run: uv run pytest -m "not integration"
      - run: uv build
      - name: Smoke-test the built wheel imports and ships py.typed
        run: |
          uv run --no-project --with "$(ls dist/*.whl)" python - <<'PY'
          import importlib.resources as res
          import pyxschem
          from pyxschem import NetAnalyzer, Schematic  # public API must import

          print("pyxschem", pyxschem.__version__, NetAnalyzer, Schematic)
          assert res.files("pyxschem").joinpath("py.typed").is_file(), (
              "py.typed missing from built wheel"
          )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyxschem
    permissions:
      id-token: write  # trusted publishing to PyPI
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Pinned to a commit SHA: this is the only step that holds id-token: write
      # (PyPI OIDC), so it must not run code from a mutable branch ref.
      # Dependabot (github-actions ecosystem) keeps the SHA current.
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          attestations: true

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Isolate the cache per Python version: a single shared key let a
          # .venv built for one version be restored into another, leaving
          # pytest uninstalled and `uv run pytest` failing to spawn.
          cache-suffix: ${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      # xschem drives the CLI tests (run headless via `-x`); without it
      # tests/test_cli.py skips and cli.py coverage falls below the gate.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xschem
      - run: uv sync --extra dev --python ${{ matrix.python-version }} --locked
      # --no-sync: reuse the venv built above. Without it, `uv run` targets
      # uv's default interpreter (3.10), sees a mismatch with the matrix
      # venv, and recreates it WITHOUT the dev extra — wiping pytest.
      - run: uv run --no-sync pytest -m "not integration" --cov=pyxschem --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: lint  # isolate from the test matrix's caches
      - run: uv sync --extra dev --locked
      - run: uv lock --check  # fail if uv.lock drifted from pyproject.toml
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run pyright src/
      - name: Audit dependencies for known vulnerabilities
        run: uv run --with pip-audit pip-audit
        continue-on-error: true  # advisory: a fix-less advisory shouldn't block PRs

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: pre-commit  # isolate from the test matrix's caches
      - run: uvx pre-commit run --all-files --show-diff-on-failure
